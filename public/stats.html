<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estatísticas · Linkito</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="min-h-screen bg-slate-100">
  <header class="bg-white shadow">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-2xl font-bold text-indigo-600">Linkito</h1>
      <button id="sair" type="button" class="text-sm text-slate-500 hover:text-red-600 font-medium">Sair</button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 space-y-6">
    <a href="painel.html" class="text-sm text-indigo-600 hover:underline">← Voltar ao painel</a>

    <p id="erro" class="hidden text-sm text-red-600"></p>

    <section id="resumo" class="hidden bg-white rounded-2xl shadow p-5">
      <a id="link-curto" target="_blank" rel="noopener" class="font-semibold text-indigo-600 break-all"></a>
      <p id="url-original" class="text-sm text-slate-500 break-all"></p>
      <p class="mt-3">
        <span id="total" class="text-4xl font-bold text-indigo-600">0</span>
        <span class="text-slate-500">cliques no total</span>
      </p>
    </section>

    <p id="sem-dados" class="hidden bg-white rounded-2xl shadow p-5 text-slate-500 text-sm">
      Ainda não há cliques neste link. Abra o link curto algumas vezes e volte aqui.
    </p>

    <div id="graficos" class="hidden space-y-6">
      <section class="bg-white rounded-2xl shadow p-5">
        <h2 class="font-semibold mb-3">Cliques por dia (últimos 30 dias)</h2>
        <canvas id="grafico-dias" height="120"></canvas>
      </section>

      <div class="grid sm:grid-cols-2 gap-6">
        <section class="bg-white rounded-2xl shadow p-5">
          <h2 class="font-semibold mb-3">Por dispositivo</h2>
          <canvas id="grafico-dispositivos"></canvas>
        </section>
        <section class="bg-white rounded-2xl shadow p-5">
          <h2 class="font-semibold mb-3">Por navegador</h2>
          <canvas id="grafico-navegadores"></canvas>
        </section>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
